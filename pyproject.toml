[project]
name = "skein-kg"
version = "0.1.0"
description = "Skein — a knowledge graph woven from embeddings, no autoregressive LLM in the loop"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
skein = "skein.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skein"]
